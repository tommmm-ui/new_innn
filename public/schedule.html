<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>健管日程查詢 | 45 天計畫</title>
  <style>
    :root {
      --bg-color: #f5f5f7;
      --card-bg: rgba(255, 255, 255, 0.8);
      --primary-color: #0071e3;
      --text-main: #1d1d1f;
      --text-sub: #86868b;
      --border-color: rgba(0, 0, 0, 0.1);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
    }

    .apple-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      margin-bottom: 24px;
    }

    h1 {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      text-align: center;
    }

    p.subtitle {
      color: var(--text-sub);
      font-size: 14px;
      margin-bottom: 24px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--text-sub);
      margin-bottom: 6px;
      font-weight: 500;
    }

    input, select {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      background: rgba(255, 255, 255, 0.7);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input:focus, select:focus {
      border-color: var(--primary-color);
    }

    .btn-apple {
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 980px;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
      transition: all 0.2s ease;
    }

    .btn-apple:hover {
      opacity: 0.9;
      transform: scale(0.99);
    }

    /* 日程卡片清單 */
    .schedule-grid {
      display: grid;
      gap: 12px;
      margin-top: 20px;
    }

    .day-card {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 14px;
      padding: 16px 20px;
      border: 1px solid rgba(0, 0, 0, 0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: transform 0.2s ease;
    }

    .day-card.today {
      border: 2px solid var(--primary-color);
      background: rgba(0, 113, 227, 0.04);
    }

    .day-type {
      font-size: 16px;
      font-weight: 600;
      color: var(--primary-color);
    }

    .badge-today {
      background: var(--primary-color);
      color: white;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 980px;
      margin-left: 6px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="apple-card">
      <h1>45 天健管日程查詢</h1>
      <p class="subtitle">輸入專屬密碼與開始日期，即刻獲取個人每日型態</p>

      <form id="search-form">
        <div class="form-group">
          <label>查詢密碼</label>
          <input type="password" id="password" placeholder="請輸入查詢密碼" required value="168168">
        </div>

        <div class="form-group">
          <label>開始執行日期（數值表第一週日期）</label>
          <input type="date" id="startDate" required>
        </div>

        <div class="form-group">
          <label>準備日模式</label>
          <select id="prepMode" onchange="togglePrepDateInput()">
            <option value="default">預設（緊接在數值表日之後）</option>
            <option value="skip">跳過準備日（直接進入蛋白日）</option>
            <option value="delay">延後準備日（自行指定日期）</option>
          </select>
        </div>

        <div class="form-group hidden" id="customPrepGroup">
          <label>開始準備日日期</label>
          <input type="date" id="customPrepStartDate">
        </div>

        <button type="submit" class="btn-apple">即刻查詢日程</button>
      </form>
    </div>

    <!-- 查詢結果 -->
    <div id="result-container" class="hidden">
      <div class="apple-card">
        <h2 style="font-size: 18px; margin-bottom: 16px;">未來 6 天日程預覽</h2>
        <div class="schedule-grid" id="schedule-list"></div>
      </div>
    </div>
  </div>

  <script>
    function togglePrepDateInput() {
      const mode = document.getElementById('prepMode').value;
      const customGroup = document.getElementById('customPrepGroup');
      if (mode === 'delay') {
        customGroup.classList.remove('hidden');
      } else {
        customGroup.classList.add('hidden');
      }
    }

    document.getElementById('search-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const password = document.getElementById('password').value;
      const startDate = document.getElementById('startDate').value;
      const prepMode = document.getElementById('prepMode').value;
      const customPrepStartDate = document.getElementById('customPrepStartDate').value;

      let url = `/api/schedule?password=${encodeURIComponent(password)}&startDate=${startDate}&prepMode=${prepMode}`;
      if (prepMode === 'delay' && customPrepStartDate) {
        url += `&customPrepStartDate=${customPrepStartDate}`;
      }

      try {
        const res = await fetch(url);
        const data = await res.json();

        if (data.success) {
          const list = document.getElementById('schedule-list');
          list.innerHTML = data.schedule.map(item => `
            <div class="day-card ${item.isToday ? 'today' : ''}">
              <div>
                <div style="font-size: 13px; color: var(--text-sub);">
                  ${item.date} 
                  ${item.isToday ? '<span class="badge-today">今天</span>' : ''}
                </div>
                <div style="font-size: 14px; font-weight: 500; margin-top: 2px;">
                  ${item.planDay} (${item.week})
                </div>
              </div>
              <div class="day-type">${item.dayType}</div>
            </div>
          `).join('');

          document.getElementById('result-container').classList.remove('hidden');
        } else {
          alert('查詢失敗：' + data.error);
        }
      } catch (err) {
        alert('連線失敗，請檢查網路連線或稍後再試');
      }
    });
  </script>
</body>
</html>
